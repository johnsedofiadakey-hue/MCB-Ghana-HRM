# ─────────────────────────────────────────────────────────────────────────────
# MCB-HRM Ghana — Render Deployment Configuration
# Last Sync: Identity & Branding Finalized (Nationality Shift)
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── Backend API ─────────────────────────────────────────────────────────────
  - type: web
    name: mcb-ghana-hrm-api
    env: node
    plan: starter          # Production baseline; avoid free-tier cold starts
    region: oregon         # Changed to match database region
    buildCommand: >
      cd server &&
      npm install --no-audit --no-fund &&
      npx prisma generate &&
      npx tsc
    startCommand: cd server && npx prisma migrate deploy && node --max-old-space-size=1024 dist/app.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PORT
        value: 10000         # Render injects PORT=10000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false          # Set to your deployed frontend URL
      - key: CORS_ORIGINS
        sync: false          # Optional comma-separated frontend/admin origins
      - key: DEV_MASTER_KEY
        generateValue: true
      - key: DEV_WHITELIST_EMAILS
        sync: false
      - key: BIOMETRIC_SYNC_KEY
        sync: false
      - key: ENABLE_DEV_ROUTES
        value: "false"
      - key: ENABLE_PRODUCTION_DEV_ROUTES
        value: "false"
      - key: ALLOW_PUBLIC_SIGNUP
        value: "false"

  # ── Frontend (Static Site) ──────────────────────────────────────────────────
  - type: web
    name: mcb-hrm-ghana-client
    env: static
    buildCommand: cd client && npm install --no-audit --no-fund && npm run build
    staticPublishPath: client/dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html   # SPA fallback for React Router
    envVars:
      - key: VITE_API_URL
        value: https://mcb-ghana-hrm-api.onrender.com/api
